<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main gradient for rays -->
    <linearGradient id="rayGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B00"/>
      <stop offset="100%" style="stop-color:#FF2574"/>
    </linearGradient>
    
    <!-- Background glow -->
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="50%">
      <stop offset="0%" style="stop-color:#FF6B00;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#FF6B00;stop-opacity:0"/>
    </radialGradient>
    
    <radialGradient id="bgGlowPink" cx="50%" cy="80%" r="40%">
      <stop offset="0%" style="stop-color:#FF2574;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#FF2574;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="64" fill="#0f0f10"/>
  
  <!-- Gradient glow effects -->
  <ellipse cx="256" cy="180" rx="220" ry="160" fill="url(#bgGlow)"/>
  <ellipse cx="256" cy="400" rx="200" ry="120" fill="url(#bgGlowPink)"/>
  
  <!-- Light rays emanating from top - centered -->
  <g transform="translate(256, 160)">
    <rect x="-7" y="-100" width="14" height="50" rx="7" fill="url(#rayGradient)" transform="rotate(0)"/>
    <rect x="-7" y="-100" width="14" height="42" rx="7" fill="url(#rayGradient)" transform="rotate(24)"/>
    <rect x="-7" y="-100" width="14" height="46" rx="7" fill="url(#rayGradient)" transform="rotate(48)"/>
    <rect x="-7" y="-100" width="14" height="38" rx="7" fill="url(#rayGradient)" transform="rotate(72)"/>
    <rect x="-7" y="-100" width="14" height="42" rx="7" fill="url(#rayGradient)" transform="rotate(96)"/>
    <rect x="-7" y="-100" width="14" height="46" rx="7" fill="url(#rayGradient)" transform="rotate(120)"/>
    <rect x="-7" y="-100" width="14" height="38" rx="7" fill="url(#rayGradient)" transform="rotate(144)"/>
    <rect x="-7" y="-100" width="14" height="50" rx="7" fill="url(#rayGradient)" transform="rotate(168)"/>
    <rect x="-7" y="-100" width="14" height="38" rx="7" fill="url(#rayGradient)" transform="rotate(-168)"/>
    <rect x="-7" y="-100" width="14" height="46" rx="7" fill="url(#rayGradient)" transform="rotate(-144)"/>
    <rect x="-7" y="-100" width="14" height="42" rx="7" fill="url(#rayGradient)" transform="rotate(-120)"/>
    <rect x="-7" y="-100" width="14" height="38" rx="7" fill="url(#rayGradient)" transform="rotate(-96)"/>
    <rect x="-7" y="-100" width="14" height="46" rx="7" fill="url(#rayGradient)" transform="rotate(-72)"/>
    <rect x="-7" y="-100" width="14" height="42" rx="7" fill="url(#rayGradient)" transform="rotate(-48)"/>
    <rect x="-7" y="-100" width="14" height="46" rx="7" fill="url(#rayGradient)" transform="rotate(-24)"/>
  </g>
  
  <!-- Lighthouse structure - properly centered -->
  <g transform="translate(256, 280)">
    <!-- Base/platform -->
    <rect x="-80" y="115" width="160" height="16" rx="4" fill="#FF6B00"/>
    
    <!-- Main tower body -->
    <path d="M-48 115 L-32 -16 L32 -16 L48 115 Z" fill="#1a1a1a" stroke="#FF6B00" stroke-width="3"/>
    
    <!-- Stripes on tower -->
    <rect x="-44" y="82" width="88" height="16" fill="#FF6B00" opacity="0.8"/>
    <rect x="-38" y="32" width="76" height="16" fill="#FF6B00" opacity="0.8"/>
    
    <!-- Light housing -->
    <rect x="-36" y="-48" width="72" height="36" rx="4" fill="#2a2a2a" stroke="#FF6B00" stroke-width="3"/>
    
    <!-- Light window/lens -->
    <rect x="-24" y="-42" width="48" height="24" rx="2" fill="#FFC000"/>
    <rect x="-16" y="-39" width="6" height="18" fill="#2a2a2a" opacity="0.3"/>
    <rect x="-3" y="-39" width="6" height="18" fill="#2a2a2a" opacity="0.3"/>
    <rect x="10" y="-39" width="6" height="18" fill="#2a2a2a" opacity="0.3"/>
    
    <!-- Roof/dome -->
    <path d="M-40 -48 L0 -78 L40 -48 Z" fill="#FF6B00"/>
    <circle cx="0" cy="-78" r="7" fill="#FFC000"/>
  </g>
  
  <!-- Wave at bottom - consistent with twitter banner -->
  <path d="M0 480 Q32 460, 64 480 Q96 500, 128 480 Q160 460, 192 480 Q224 500, 256 480 Q288 460, 320 480 Q352 500, 384 480 Q416 460, 448 480 Q480 500, 512 480 L512 512 L0 512 Z" 
        fill="url(#rayGradient)" opacity="0.2"/>
</svg>