<svg width="1500" height="500" viewBox="0 0 1500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Title gradient -->
    <linearGradient id="bannerTitleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF2574"/>
      <stop offset="50%" style="stop-color:#FF8AB2"/>
      <stop offset="100%" style="stop-color:#FF6B00"/>
    </linearGradient>
    
    <!-- Flame gradient -->
    <linearGradient id="bannerFlameGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#FF2574"/>
      <stop offset="50%" style="stop-color:#FF6B00"/>
      <stop offset="100%" style="stop-color:#FFC000"/>
    </linearGradient>
    
    <!-- Background glows -->
    <radialGradient id="bannerGlowOrange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF6B00;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#FF6B00;stop-opacity:0"/>
    </radialGradient>
    
    <radialGradient id="bannerGlowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF2574;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#FF2574;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1500" height="500" fill="#0f0f10"/>
  
  <!-- Gradient glow orbs -->
  <ellipse cx="200" cy="250" rx="280" ry="220" fill="url(#bannerGlowOrange)"/>
  <ellipse cx="1350" cy="300" rx="220" ry="180" fill="url(#bannerGlowPink)"/>
  <ellipse cx="750" cy="80" rx="350" ry="120" fill="url(#bannerGlowOrange)" opacity="0.4"/>
  
  <!-- Left side: Flame Logo - vertically centered -->
  <g transform="translate(180, 250) scale(1.8)">
    <!-- Outer glow -->
    <ellipse cx="0" cy="60" rx="80" ry="50" fill="#FF6B00" opacity="0.15"/>
    
    <!-- Main flame path -->
    <path d="M0 -60 
             C20 -20, 50 10, 50 50 
             C50 85, 28 100, 0 100 
             C-28 100, -50 85, -50 50 
             C-50 10, -20 -20, 0 -60 Z" 
          fill="url(#bannerFlameGradient)"/>
    
    <!-- Inner flame -->
    <path d="M0 0 
             C10 20, 28 35, 28 55 
             C28 75, 15 85, 0 85 
             C-15 85, -28 75, -28 55 
             C-28 35, -10 20, 0 0 Z" 
          fill="#FF8C42"/>
    
    <!-- Core glow -->
    <ellipse cx="0" cy="65" rx="12" ry="16" fill="#FFD700" opacity="0.8"/>
  </g>
  
  <!-- Center/Right: Text content - vertically centered -->
  <g transform="translate(420, 0)">
    <!-- Main title -->
    <text x="0" y="200" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" 
          font-size="68" 
          font-weight="700" 
          fill="url(#bannerTitleGradient)"
          letter-spacing="-2">
      Lighthouse Dark
    </text>
    
    <!-- Tagline -->
    <text x="0" y="260" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" 
          font-size="26" 
          font-weight="500" 
          fill="#888888">
      The metrics Google is too polite to give you.
    </text>
    
    <!-- Features pills -->
    <g transform="translate(0, 295)">
      <!-- SEO pill -->
      <g>
        <rect x="0" y="0" width="70" height="30" rx="15" fill="#FF6B00" opacity="0.15"/>
        <text x="35" y="20" 
              font-family="system-ui, -apple-system, sans-serif" 
              font-size="13" 
              font-weight="600" 
              fill="#FF6B00" 
              text-anchor="middle">
          SEO
        </text>
      </g>
      
      <!-- Core Web Vitals pill -->
      <g transform="translate(85, 0)">
        <rect x="0" y="0" width="140" height="30" rx="15" fill="#FF2574" opacity="0.15"/>
        <text x="70" y="20" 
              font-family="system-ui, -apple-system, sans-serif" 
              font-size="13" 
              font-weight="600" 
              fill="#FF2574" 
              text-anchor="middle">
          Core Web Vitals
        </text>
      </g>
      
      <!-- AI Roast pill -->
      <g transform="translate(240, 0)">
        <rect x="0" y="0" width="90" height="30" rx="15" fill="#FFC000" opacity="0.15"/>
        <text x="45" y="20" 
              font-family="system-ui, -apple-system, sans-serif" 
              font-size="13" 
              font-weight="600" 
              fill="#FFC000" 
              text-anchor="middle">
          AI Roast
        </text>
      </g>
    </g>
  </g>
  
  <!-- Decorative wave at bottom -->
  <path d="M0 485 Q75 465, 150 485 Q225 500, 300 485 Q375 465, 450 485 Q525 500, 600 485 Q675 465, 750 485 Q825 500, 900 485 Q975 465, 1050 485 Q1125 500, 1200 485 Q1275 465, 1350 485 Q1425 500, 1500 485 L1500 500 L0 500 Z" 
        fill="url(#bannerFlameGradient)" opacity="0.2"/>
</svg>