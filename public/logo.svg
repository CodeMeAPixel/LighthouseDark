<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main gradient for rays -->
    <linearGradient id="rayGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B00"/>
      <stop offset="100%" style="stop-color:#FF2574"/>
    </linearGradient>
    
    <!-- Lighthouse body gradient -->
    <linearGradient id="lighthouseGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#2a2a2a"/>
    </linearGradient>
    
    <!-- Light beam gradient -->
    <linearGradient id="beamGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFC000;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FF6B00;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <!-- Light rays emanating from top -->
  <g transform="translate(256, 140)">
    <!-- Ray 1 - top -->
    <rect x="-8" y="-120" width="16" height="60" rx="8" fill="url(#rayGradient)" transform="rotate(0)"/>
    <!-- Ray 2 -->
    <rect x="-8" y="-120" width="16" height="50" rx="8" fill="url(#rayGradient)" transform="rotate(25)"/>
    <!-- Ray 3 -->
    <rect x="-8" y="-120" width="16" height="55" rx="8" fill="url(#rayGradient)" transform="rotate(50)"/>
    <!-- Ray 4 -->
    <rect x="-8" y="-120" width="16" height="45" rx="8" fill="url(#rayGradient)" transform="rotate(75)"/>
    <!-- Ray 5 -->
    <rect x="-8" y="-120" width="16" height="50" rx="8" fill="url(#rayGradient)" transform="rotate(100)"/>
    <!-- Ray 6 -->
    <rect x="-8" y="-120" width="16" height="55" rx="8" fill="url(#rayGradient)" transform="rotate(125)"/>
    <!-- Ray 7 -->
    <rect x="-8" y="-120" width="16" height="45" rx="8" fill="url(#rayGradient)" transform="rotate(155)"/>
    <!-- Ray 8 - bottom left -->
    <rect x="-8" y="-120" width="16" height="60" rx="8" fill="url(#rayGradient)" transform="rotate(180)"/>
    <!-- Ray 9 -->
    <rect x="-8" y="-120" width="16" height="45" rx="8" fill="url(#rayGradient)" transform="rotate(-155)"/>
    <!-- Ray 10 -->
    <rect x="-8" y="-120" width="16" height="55" rx="8" fill="url(#rayGradient)" transform="rotate(-125)"/>
    <!-- Ray 11 -->
    <rect x="-8" y="-120" width="16" height="50" rx="8" fill="url(#rayGradient)" transform="rotate(-100)"/>
    <!-- Ray 12 -->
    <rect x="-8" y="-120" width="16" height="45" rx="8" fill="url(#rayGradient)" transform="rotate(-75)"/>
    <!-- Ray 13 -->
    <rect x="-8" y="-120" width="16" height="55" rx="8" fill="url(#rayGradient)" transform="rotate(-50)"/>
    <!-- Ray 14 -->
    <rect x="-8" y="-120" width="16" height="50" rx="8" fill="url(#rayGradient)" transform="rotate(-25)"/>
  </g>
  
  <!-- Lighthouse structure -->
  <g transform="translate(256, 256)">
    <!-- Base/platform -->
    <rect x="-100" y="140" width="200" height="20" rx="4" fill="#FF6B00"/>
    
    <!-- Main tower body - trapezoid shape -->
    <path d="M-60 140 L-40 -20 L40 -20 L60 140 Z" fill="url(#lighthouseGradient)" stroke="#FF6B00" stroke-width="3"/>
    
    <!-- Stripes on tower -->
    <rect x="-55" y="100" width="110" height="20" fill="#FF6B00" opacity="0.8"/>
    <rect x="-48" y="40" width="96" height="20" fill="#FF6B00" opacity="0.8"/>
    
    <!-- Light housing -->
    <rect x="-45" y="-60" width="90" height="45" rx="4" fill="#2a2a2a" stroke="#FF6B00" stroke-width="3"/>
    
    <!-- Light window/lens -->
    <rect x="-30" y="-52" width="60" height="30" rx="2" fill="#FFC000"/>
    <rect x="-20" y="-48" width="8" height="22" fill="#2a2a2a" opacity="0.3"/>
    <rect x="-4" y="-48" width="8" height="22" fill="#2a2a2a" opacity="0.3"/>
    <rect x="12" y="-48" width="8" height="22" fill="#2a2a2a" opacity="0.3"/>
    
    <!-- Roof/dome -->
    <path d="M-50 -60 L0 -95 L50 -60 Z" fill="#FF6B00"/>
    <circle cx="0" cy="-95" r="8" fill="#FFC000"/>
  </g>
  
  <!-- Wave at bottom -->
  <path d="M80 430 
           Q120 400, 160 430 
           Q200 460, 240 430
           Q280 400, 320 430
           Q360 460, 400 430
           Q440 400, 480 430
           L480 480 L80 480 Z" 
        fill="url(#rayGradient)" opacity="0.3"/>
</svg>