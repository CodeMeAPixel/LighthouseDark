<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Title gradient - pink to orange -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF2574"/>
      <stop offset="50%" style="stop-color:#FF8AB2"/>
      <stop offset="100%" style="stop-color:#FF6B00"/>
    </linearGradient>
    
    <!-- Flame gradient -->
    <linearGradient id="flameGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#FF2574"/>
      <stop offset="50%" style="stop-color:#FF6B00"/>
      <stop offset="100%" style="stop-color:#FFC000"/>
    </linearGradient>
    
    <!-- Background glow -->
    <radialGradient id="glowOrange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF6B00;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#FF6B00;stop-opacity:0"/>
    </radialGradient>
    
    <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF2574;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#FF2574;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="#0f0f10"/>
  
  <!-- Gradient glow orbs -->
  <ellipse cx="900" cy="100" rx="400" ry="300" fill="url(#glowOrange)"/>
  <ellipse cx="200" cy="500" rx="350" ry="250" fill="url(#glowPink)"/>
  
  <!-- Flame icon -->
  <g transform="translate(600, 140)">
    <!-- Outer glow -->
    <ellipse cx="0" cy="60" rx="80" ry="50" fill="#FF6B00" opacity="0.15"/>
    
    <!-- Main flame path -->
    <path d="M0 -60 
             C20 -20, 50 10, 50 50 
             C50 85, 28 100, 0 100 
             C-28 100, -50 85, -50 50 
             C-50 10, -20 -20, 0 -60 Z" 
          fill="url(#flameGradient)"/>
    
    <!-- Inner flame -->
    <path d="M0 0 
             C10 20, 28 35, 28 55 
             C28 75, 15 85, 0 85 
             C-15 85, -28 75, -28 55 
             C-28 35, -10 20, 0 0 Z" 
          fill="#FF8C42"/>
    
    <!-- Core glow -->
    <ellipse cx="0" cy="65" rx="12" ry="16" fill="#FFD700" opacity="0.8"/>
  </g>
  
  <!-- Title: Lighthouse Dark -->
  <text x="600" y="330" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="72" 
        font-weight="700" 
        fill="url(#titleGradient)" 
        text-anchor="middle"
        letter-spacing="-2">
    Lighthouse Dark
  </text>
  
  <!-- Tagline -->
  <text x="600" y="400" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="32" 
        font-weight="500" 
        fill="#AAAAAA" 
        text-anchor="middle">
    The metrics Google is too polite to give you.
  </text>
  
  <!-- Beta badge -->
  <g transform="translate(870, 295)">
    <rect x="0" y="0" width="60" height="24" rx="12" fill="#FF6B00" opacity="0.15"/>
    <text x="30" y="17" 
          font-family="system-ui, sans-serif" 
          font-size="12" 
          font-weight="600" 
          fill="#FF6B00" 
          text-anchor="middle">
      Beta
    </text>
  </g>
  
  <!-- Bottom URL -->
  <text x="600" y="580" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="20" 
        font-weight="600" 
        fill="#666666" 
        text-anchor="middle">
    lighthousedark.org
  </text>
</svg>
